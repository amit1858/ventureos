[project]
name = "ventureos-contracts"
version = "0.0.0"
description = "Hand-mirrored Python contracts for VentureOS JSON schemas."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/ventureos_contracts"]
