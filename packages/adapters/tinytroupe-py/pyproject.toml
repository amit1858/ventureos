[project]
name = "ventureos-tinytroupe-adapter"
version = "0.0.0"
description = "Adapter that wraps Microsoft TinyTroupe for VentureOS PersonaLab. Sprint 0: interface only."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "ventureos-contracts",
  "ventureos-providers-core",
  # NOTE: tinytroupe itself is NOT a dependency yet. M1 will pin tinytroupe==0.7.0.
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.uv.sources]
ventureos-contracts = { workspace = true }
ventureos-providers-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ventureos_tinytroupe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
