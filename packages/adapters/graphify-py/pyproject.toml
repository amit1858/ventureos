[project]
name = "foundry-graphify-adapter"
version = "0.0.0"
description = "Adapter that wraps Graphify for Foundry VentureLab research graphs. Sprint 0: interface only."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "foundry-contracts",
  "foundry-providers-core",
  # graphifyy==0.8.25 is NOT pinned yet; landed in M1.
]

[tool.uv.sources]
foundry-contracts = { workspace = true }
foundry-providers-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_graphify"]
