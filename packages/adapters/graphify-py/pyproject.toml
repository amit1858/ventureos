[project]
name = "ventureos-graphify-adapter"
version = "0.0.0"
description = "Adapter that wraps Graphify for VentureOS VentureLab research graphs. Sprint 0: interface only."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "ventureos-contracts",
  "ventureos-providers-core",
  # graphifyy==0.8.25 is NOT pinned yet; landed in M1.
]

[tool.uv.sources]
ventureos-contracts = { workspace = true }
ventureos-providers-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ventureos_graphify"]
