[project]
name = "foundry-providers-core"
version = "0.0.0"
description = "Foundry provider abstraction (Python). Adapters live in separate packages."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "foundry-contracts",
]

[tool.uv.sources]
foundry-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_providers"]
