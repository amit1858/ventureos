[project]
name = "foundry-security"
version = "0.0.0"
description = "Masking, redaction, and key-shape validation utilities (Python)."
requires-python = ">=3.11"
dependencies = ["foundry-contracts"]

[tool.uv.sources]
foundry-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_security"]
